# Render's free plan puts the backend to sleep after 15 minutes without requests,
# and the next visitor then waits 20-50 seconds while it wakes up. This pings the
# health check every 10 minutes so it stays awake. (One always-on free service fits
# inside Render's 750 free instance hours a month.)
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch: # also lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        env:
          HEALTH_URL: https://portfolio-faua.onrender.com/api/health
        # Retries cover the case where it was asleep anyway and takes a while to wake.
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 "$HEALTH_URL"
